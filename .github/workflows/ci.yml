name: Test CI/CD Workflow
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
        
      - name: Cache des dependances Node.js
        uses: actions/cache@v4
        with:
          path: front-new/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('front-new/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-  

      - name: Installer les dependances
        working-directory: front-new
        run: npm ci

      - name: Lint
        working-directory: front-new
        run: npm run lint

      - name: Tests React (Vitest)
        working-directory: front-new
        run: npm test
        env:
          VITE_API_URL: /api


  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: installer nodejs pour le backend
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Run backend tests
        working-directory: backend
        run: |
          npm ci  


  buildpushfrontend:
    needs: test-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/my-image

      - name: Log in to Docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: buildfrontend
        uses: docker/build-push-action@v6
        with:
          context: ./front-new
          file: ./front-new/dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
            BACKEND_INTERNAL_URL=http://backend:8080         
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/immo_fronted_prod:latest
            ${{ secrets.DOCKER_USERNAME }}/immo_fronted_prod:${{ github.ref_name }}
      - name: Scan de l'image Docker Frontend avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/immo_fronted_prod:${{ github.ref_name }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'   
          
  buildpushbackend:
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/my-image

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          
          file: ./backend/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/immo_backend_prod:latest
            ${{ secrets.DOCKER_USERNAME }}/immo_backend_prod:${{ github.ref_name }}

      - name: Scan de l'image Docker Backend avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/immo_backend_prod:${{ github.ref_name }}'          
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'   
          
  deploy:
    needs: [buildpushfrontend, buildpushbackend]
    runs-on: ubuntu-latest
    steps:
      - name: Ckeckout du code
        uses: actions/checkout@v4

      - name: Envoyer docker-compose.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/nantenaina/immo_tul"

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.9
        env:
          IMAGE_TAG: ${{ github.ref_name }}       
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG


          script: |
            mkdir -p /home/nantenaina/immo_tul
            cd /home/nantenaina/immo_tul
            export IMAGE_TAG
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d

