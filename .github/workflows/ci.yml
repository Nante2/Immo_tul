name: Test CI/CD Workflow
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v6

      - name: installer nodejs
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'front-new/package-lock.json'

      - name: build frontend
        working-directory: front-new
        run: |
          npm ci
          npm run build

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: installer nodejs pour le backend
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Run backend tests
        working-directory: backend
        run: |
          npm ci  
  buildpushfrontend:
    needs: test-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/my-image

      - name: Log in to Docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: buildfrontend
        uses: docker/build-push-action@v6
        with:
          context: ./front-new
          file: ./front-new/dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/immo_fronted_prod:latest

  buildpushbackend:
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/my-image

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          
          file: ./backend/dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/immo_backend_prod:latest       
