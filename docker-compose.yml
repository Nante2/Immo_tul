services:
  backend:
    container_name: immo_backend_prod
    image: nante2/immo_backend_prod:latest
    ports:
      - "4001:8080"
    env_file:
      - .env  
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bd:
          condition: service_healthy
    networks:
      - nantenaina

  bd:
   container_name: immo_postgres
   image: postgres:16-alpine 
   restart: unless-stopped
   ports:
     - "8000:5432"
   environment:
     POSTGRES_DB: ${POSTGRES_DB}
     POSTGRES_USER: ${POSTGRES_USER}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   
   volumes:
     - postgres_immo_data:/var/lib/postgresql/data
   networks:
     - nantenaina
   healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immo_tul"]
      interval: 5s
      timeout: 5s
      retries: 5
 
  frontend:
   container_name: immo_fronted_prod
   image: nante2/immo_fronted_prod:latest
     
   ports:
     - "5000:80"
   volumes:
     - ./nginx.conf:/etc/nginx/conf.d/default.conf 
   environment:
     - BACKEND_INTERNAL_URL=http://backend:8080
   depends_on:
     - backend
   networks:
     - nantenaina

volumes:
  postgres_immo_data:
    name: postgres_dev_immo_data

networks:
  nantenaina:
    name: nantenainanetwork
    driver: bridge

