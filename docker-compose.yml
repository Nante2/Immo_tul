services:
  backend:
    container_name: immo_backend_prod
    image: nante2/immo_backend_prod:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 512m

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - immo_uploads:/app/uploads
    depends_on:
      bd:
          condition: service_healthy
    networks:
      - nantenaina

  bd:
   container_name: immo_postgres
   image: postgres:16-alpine
   restart: unless-stopped
   mem_limit: 512m

   environment:
     POSTGRES_DB: ${POSTGRES_DB}
     POSTGRES_USER: ${POSTGRES_USER}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
   volumes:
     - postgres_immo_data:/var/lib/postgresql/data
   networks:
     - nantenaina
   healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immo_tul"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
   container_name: immo_fronted_prod
   image: nante2/immo_fronted_prod:${IMAGE_TAG:-latest}
   restart: unless-stopped
   mem_limit: 128m
   volumes:
     - ./nginx.conf:/etc/nginx/conf.d/default.conf

   depends_on:
     - backend
   networks:
     - nantenaina
     - ecole_proxy
   labels:
     - "traefik.enable=true"
     - "traefik.docker.network=ecole_network_prod"
     - "traefik.http.routers.immo.rule=Host(`nantenaina.ejlogiciel.com`)"
     - "traefik.http.routers.immo.entrypoints=websecure"
     - "traefik.http.routers.immo.tls=true"
     - "traefik.http.routers.immo.tls.certresolver=le"
     - "traefik.http.services.immo.loadbalancer.server.port=80"

volumes:
  postgres_immo_data:
    name: postgres_dev_immo_data
  immo_uploads:
    name: immo_uploads_prod

networks:
  nantenaina:
    name: nantenainanetwork
    driver: bridge
  ecole_proxy:
    external: true
    name: ecole_network_prod
