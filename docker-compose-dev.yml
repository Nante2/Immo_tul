services:
  backend:
    container_name: immo_backend
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "4001:8080"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${BACKEND_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}     
      - FRONTEND_URL=${FRONTEND_URL}   
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - bd
    networks:
      - nantenaina

  bd:
   container_name: immo_postgres
   image: postgres:16-alpine 
   restart: unless-stopped
   ports:
     - "8000:5432"
   environment:
     POSTGRES_DB: ${POSTGRES_DB}
     POSTGRES_USER: ${POSTGRES_USER}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   
   volumes:
     - postgres_immo_data:/var/lib/postgresql/data
   networks:
     - nantenaina

  fronted:
   container_name: immo_fronted
   build:
     context: ./front-new
     dockerfile: dockerfile
     args:
       
       VITE_API_URL: ${VITE_API_URL} 
   ports:
     - "5000:80"
   
   depends_on:
     - backend
   networks:
     - nantenaina

volumes:
  postgres_immo_data:
    name: postgres_dev_immo_data

networks:
  nantenaina:
    name: nantenainanetwork
    driver: bridge



   
